name: Release walk
# The protocol's human walk, walked by Playwright as the verification member.
# Design: documentation/20260923-release-walk-automation.md. Called by the
# production merge workflow after the acknowledgement step; workflow_dispatch
# is for a walk on demand.
#
# Three secrets: WALK_MEMBER_EMAIL, WALK_MEMBER_PASSWORD (the verification
# member's own, not a person's) and WALK_APPCHECK_DEBUG_TOKEN, registered on
# the prod web app so the App Check SDK skips Turnstile — a challenge built to
# fail exactly this browser. Enforcement stays on; the rules still apply.
on:
  workflow_call:
    inputs:
      project:
        type: string
        required: true
      release:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      project:
        type: choice
        options: [prod]
        default: prod
jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # FROM CI THE WALK GOES TO THE HOSTING ORIGIN, NOT vscn.ch. vscn.ch is
      # proxied by Cloudflare, whose bot protection answers a GitHub runner's
      # datacenter IP with a 403 "Just a moment..." challenge before the site
      # is reached (first CI walk, 2026-09-23). vscn-39508.web.app is the same
      # Hosting release, byte for byte, and an authorised Auth domain; every
      # Firebase call is identical. What this skips is Cloudflare itself, which
      # does not change per release. A local run still walks vscn.ch.
      - name: Walk the site as the verification member
        run: npm run walk:release -- --project "${{ inputs.project || 'prod' }}" --origin https://vscn-39508.web.app --release "${{ inputs.release || github.sha }}"
        env:
          WALK_MEMBER_EMAIL: ${{ secrets.WALK_MEMBER_EMAIL }}
          WALK_MEMBER_PASSWORD: ${{ secrets.WALK_MEMBER_PASSWORD }}
          WALK_APPCHECK_DEBUG_TOKEN: ${{ secrets.WALK_APPCHECK_DEBUG_TOKEN }}
      # A second layer behind the redaction in scripts/walk-release.mjs, and
      # independent of it: whatever wrote into walk-artifacts, a file that still
      # holds one of the walk's secrets is dropped before the upload. The repo is
      # public, so any GitHub account can download a workflow artifact, and
      # secret masking covers the step log only. If this step cannot run,
      # nothing is uploaded.
      - name: Drop any artifact file that still holds a walk secret
        id: scrub
        if: failure()
        env:
          WALK_MEMBER_EMAIL: ${{ secrets.WALK_MEMBER_EMAIL }}
          WALK_MEMBER_PASSWORD: ${{ secrets.WALK_MEMBER_PASSWORD }}
          WALK_APPCHECK_DEBUG_TOKEN: ${{ secrets.WALK_APPCHECK_DEBUG_TOKEN }}
        run: |
          clean=true
          for raw in "$WALK_APPCHECK_DEBUG_TOKEN" "$WALK_MEMBER_PASSWORD" "$WALK_MEMBER_EMAIL"; do
            # Trimmed as walkCredentials trims; under 6 characters is not a secret.
            secret="${raw#"${raw%%[![:space:]]*}"}"
            secret="${secret%"${secret##*[![:space:]]}"}"
            [ "${#secret}" -ge 6 ] || continue
            hits=$(grep -rlF -e "$secret" walk-artifacts 2>/dev/null || true)
            [ -n "$hits" ] || continue
            clean=false
            echo "::error::walk-artifacts held a walk secret despite the redaction; dropped before the upload: ${hits//$'\n'/, }"
            printf '%s\n' "$hits" | while IFS= read -r file; do rm -f -- "$file"; done
          done
          if $clean; then echo "walk-artifacts: no walk secret in any file"; fi
      - if: failure() && steps.scrub.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: walk-artifacts
          path: walk-artifacts
          retention-days: 14
          if-no-files-found: ignore
