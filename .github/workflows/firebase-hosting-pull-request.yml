# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
permissions:
  contents: read
concurrency:
  group: firebase-preview-${{ github.event.number }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/verify.yml
  export:
    needs: verify
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: vscn-dev-f4b60
          workload_identity_provider: projects/640269226461/locations/global/workloadIdentityPools/vscn-site-export/providers/github-vscn
          service_account: vscn-build-reader@vscn-dev-f4b60.iam.gserviceaccount.com
          export_environment_variables: false
      - run: npm run export:site-data development
        env:
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.DEV_FIREBASE_STORAGE_BUCKET }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
      - if: always()
        run: rm -f "${{ steps.auth.outputs.credentials_file_path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: preview-data
          path: .site-data.json
          include-hidden-files: true
          retention-days: 1
  render:
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: preview-data
      - run: npm run build:site -- --mode development
        env:
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.DEV_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.DEV_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.DEV_FIREBASE_STORAGE_BUCKET }}
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.DEV_FIREBASE_MESSAGING_SENDER_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ secrets.DEV_FIREBASE_APP_ID }}
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      - uses: actions/upload-artifact@v4
        with:
          name: preview-dist
          path: dist
          retention-days: 1
  build_and_preview:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: preview-dist
          path: dist
      - id: preview-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: vscn-dev-f4b60
          workload_identity_provider: projects/640269226461/locations/global/workloadIdentityPools/vscn-pr-preview/providers/github-pr
          service_account: vscn-pr-preview@vscn-dev-f4b60.iam.gserviceaccount.com
      - name: Deploy isolated preview channel
        run: >-
          npx -y firebase-tools@latest hosting:channel:deploy "pr-${{ github.event.number }}"
          --expires 7d --no-authorized-domains --project vscn-dev-f4b60
          --config firebase.preview.json --non-interactive --json | tee firebase-preview.json
      - name: Add preview URL to pull request
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- vscn-isolated-firebase-preview -->';
            const response = JSON.parse(fs.readFileSync('firebase-preview.json', 'utf8'));
            const deployment = Object.values(response.result ?? {})[0];
            if (response.status !== 'success' || !deployment?.url) {
              throw new Error('Firebase CLI did not return a preview URL');
            }
            const body = `${marker}\n### Staging-data preview\n\n${deployment.url}\n\nExpires after 7 days. Authentication providers that require an authorized domain are unavailable on this isolated preview.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - if: always()
        run: rm -f "${{ steps.preview-auth.outputs.credentials_file_path }}" firebase-preview.json

  delete_preview:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: preview-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: vscn-dev-f4b60
          workload_identity_provider: projects/640269226461/locations/global/workloadIdentityPools/vscn-pr-preview/providers/github-pr
          service_account: vscn-pr-preview@vscn-dev-f4b60.iam.gserviceaccount.com
      # A PR merged before its preview finished building has no channel to
      # delete: the "opened" run is cancelled by the "closed" one, so the
      # channel was never created, and Firebase answers 404. That is the state
      # this job exists to reach, so only that answer is forgiven; any other
      # failure still fails the job. Release PRs from dev are merged within
      # seconds of opening, which is how #41 turned this job red (2026-09-17).
      - shell: bash
        run: |
          set -o pipefail
          channel="pr-${{ github.event.number }}"
          if npx -y firebase-tools@latest hosting:channel:delete "$channel" \
               --site vscn-dev-f4b60 --project vscn-dev-f4b60 \
               --force --non-interactive 2>&1 | tee channel-delete.log; then
            exit 0
          fi
          if grep -q "HTTP Error: 404" channel-delete.log; then
            echo "No preview channel $channel to delete; the preview never built."
            exit 0
          fi
          exit 1
      - if: always()
        run: rm -f "${{ steps.preview-auth.outputs.credentials_file_path }}" channel-delete.log
