name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: production-hosting
  cancel-in-progress: false
jobs:
  # A MEMBER REBUILD DOES NOT RE-TEST THE CODE. A workflow_dispatch from
  # flushMemberRebuilds builds the same commit an earlier run already built;
  # only the Firestore data is new, and verify reads none of it. So verify is
  # skipped when THIS commit already has a green `verify / verify` check run,
  # and runs otherwise: when this commit's push run failed verify, or was
  # replaced in the concurrency queue before it got that far. A push always
  # verifies. The lookup fails open, so an API error means verify runs.
  # Security rules still deploy on every run (about 4 s): a release that failed
  # at the rules step skipped Hosting too, and a rebuild that then deployed
  # Hosting alone would put the frontend ahead of its rules.
  # The jobs below verify carry `!cancelled() && !failure()` because a skipped
  # job otherwise skips everything downstream of it, transitively.
  verified:
    runs-on: ubuntu-latest
    permissions:
      checks: read
    outputs:
      already: ${{ steps.lookup.outputs.already }}
    steps:
      - id: lookup
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=verify%20%2F%20verify&filter=all"             --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null || echo 0)
          if [ "$runs" -gt 0 ] 2>/dev/null; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_SHA already passed verify ($runs green runs); this rebuild skips it."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
  verify:
    needs: verified
    if: needs.verified.outputs.already != 'true'
    uses: ./.github/workflows/verify.yml
  # BACKEND BEFORE HOSTING. A frontend must never go live ahead of the
  # callables it calls, so Functions deploy first and a failure stops the run.
  # A release (push) always deploys. A workflow_dispatch is a member-triggered
  # rebuild from flushMemberRebuilds, several an hour: it asks the Functions
  # API whether every export already carries this commit's source digest
  # (scripts/backend-current.mjs) and deploys only when one does not, e.g.
  # after a release whose backend deploy failed. Publishing content therefore
  # does not redeploy the backend on every member save.
  # Production is fail-closed: without its deploy identity nothing publishes.
  backend:
    needs: verify
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require backend deploy identity
        id: identity
        env:
          BACKEND_PROVIDER: ${{ vars.PROD_FUNCTIONS_WIF_PROVIDER }}
          BACKEND_ACCOUNT: ${{ vars.PROD_FUNCTIONS_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$BACKEND_PROVIDER" ] && [ -n "$BACKEND_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::PROD_FUNCTIONS_WIF_PROVIDER and PROD_FUNCTIONS_SERVICE_ACCOUNT must be set: production never publishes a frontend without deploying its backend."
            exit 1
          fi
      - if: steps.identity.outputs.configured == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.identity.outputs.configured == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - if: steps.identity.outputs.configured == 'true'
        run: npm ci
      - if: steps.identity.outputs.configured == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: vscn-39508
          workload_identity_provider: ${{ vars.PROD_FUNCTIONS_WIF_PROVIDER }}
          service_account: ${{ vars.PROD_FUNCTIONS_SERVICE_ACCOUNT }}
      - name: Is this commit's backend already deployed?
        id: current
        if: steps.identity.outputs.configured == 'true' && github.event_name != 'push'
        run: node scripts/backend-current.mjs --project vscn-39508
      - name: Deploy backend before exporting or deploying Hosting
        if: steps.identity.outputs.configured == 'true' && (github.event_name == 'push' || steps.current.outputs.current != 'true')
        env:
          # The CLI's 10 s discovery window is too tight for this codebase
          # (memory note functions-deploy-discovery-timeout); seconds.
          FUNCTIONS_DISCOVERY_TIMEOUT: "60"
        run: npx -y firebase-tools@15.32.0 deploy --only functions --project vscn-39508 --non-interactive
  export:
    needs: [verify, backend]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      revision: ${{ steps.publication.outputs.revision }}
      generation: ${{ steps.publication.outputs.generation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: vscn-39508
          workload_identity_provider: projects/365553954084/locations/global/workloadIdentityPools/vscn-site-export/providers/github-vscn
          service_account: vscn-build-reader@vscn-39508.iam.gserviceaccount.com
          export_environment_variables: false
      - id: publication
        run: node scripts/publication.mjs begin
        env:
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.PUBLIC_FIREBASE_STORAGE_BUCKET }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
      - run: npm run export:site-data
        env:
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.PUBLIC_FIREBASE_STORAGE_BUCKET }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
      - if: always()
        run: rm -f "${{ steps.auth.outputs.credentials_file_path }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-data
          path: .site-data.json
          include-hidden-files: true
          retention-days: 1
  render:
    needs: export
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-data
      - run: npm run build:site
        env:
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.PUBLIC_FIREBASE_STORAGE_BUCKET }}
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-dist
          path: dist
          retention-days: 1
  deploy:
    needs: [export, render]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-dist
          path: dist
      - id: deploy-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: vscn-39508
          workload_identity_provider: projects/365553954084/locations/global/workloadIdentityPools/vscn-hosting-deploy/providers/github-main
          service_account: vscn-hosting-deployer@vscn-39508.iam.gserviceaccount.com
      # RULES GO BEFORE HOSTING, in the same job and on the same credential.
      # Until 2026-09-22 nothing deployed rules at all: both workflows were
      # --only hosting, so every ruleset change was a hand deploy somebody had
      # to remember. An old branch's rules once silently replaced newer ones that
      # way, and the storage size cap went with them. The order is the other
      # half of it: a frontend that writes a new field fails SILENTLY against
      # rules that predate it, because the hasOnly allowlist rejects the whole
      # write with no error anywhere. Deploying rules first cannot regress that.
      #
      # The deployer needs TWO roles for this, both recorded in the EXPECTED
      # table in scripts/verify-release.mjs: firebaserules.admin to publish a
      # ruleset, and firebasestorage.viewer because publishing the STORAGE
      # ruleset first looks up the project default bucket, which the rules role
      # does not permit. Read-only on purpose — firebasestorage.admin can create
      # and delete the default bucket, which no deploy credential should be able
      # to do. The rules themselves are already tested against the emulator by
      # verify, in this run or an earlier one of the same commit.
      - name: Deploy security rules
        run: npx -y firebase-tools@15.32.0 deploy --only firestore:rules,storage --project vscn-39508 --non-interactive
      - run: npx -y firebase-tools@15.32.0 deploy --only hosting --project vscn-39508 --non-interactive
      - if: always()
        run: rm -f "${{ steps.deploy-auth.outputs.credentials_file_path }}"
      - id: publication-auth
        if: needs.export.outputs.revision != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/365553954084/locations/global/workloadIdentityPools/vscn-hosting-deploy/providers/github-main
          service_account: vscn-hosting-deployer@vscn-39508.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: https://us-central1-vscn-39508.cloudfunctions.net/acknowledgeSitePublication
          create_credentials_file: false
      - name: Acknowledge published revision
        if: needs.export.outputs.revision != ''
        env:
          PUBLICATION_TOKEN: ${{ steps.publication-auth.outputs.id_token }}
          PUBLICATION_REVISION: ${{ needs.export.outputs.revision }}
          PUBLICATION_GENERATION: ${{ needs.export.outputs.generation }}
        run: |
          curl --fail-with-body --retry 3 -X POST 'https://us-central1-vscn-39508.cloudfunctions.net/acknowledgeSitePublication' \
            -H "Authorization: Bearer $PUBLICATION_TOKEN" -H 'Content-Type: application/json' \
            --data "{\"revision\":\"$PUBLICATION_REVISION\",\"generation\":$PUBLICATION_GENERATION}"
  # THE WALK FOLLOWS THE RELEASE — and only the release. Every walk saves the
  # member's profile, which dirties rebuildQueue/site, and flushMemberRebuilds
  # then dispatches THIS workflow as workflow_dispatch within a minute. A
  # walk that also ran on that dispatch would dirty the queue again: the site
  # would rebuild itself, and walk itself, every few minutes for ever. Hence
  # the event gate. Design: documentation/20260923-release-walk-automation.md.
  walk:
    needs: deploy
    if: github.event_name == 'push'
    uses: ./.github/workflows/release-walk.yml
    with:
      project: prod
      release: ${{ github.sha }}
    secrets: inherit
