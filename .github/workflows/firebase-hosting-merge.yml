name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: production-hosting
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  export:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      revision: ${{ steps.publication.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: vscn-39508
          workload_identity_provider: projects/365553954084/locations/global/workloadIdentityPools/vscn-site-export/providers/github-vscn
          service_account: vscn-build-reader@vscn-39508.iam.gserviceaccount.com
          export_environment_variables: false
      - id: publication
        run: node scripts/publication.mjs begin
        env:
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.PUBLIC_FIREBASE_STORAGE_BUCKET }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
      - run: npm run export:site-data
        env:
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.PUBLIC_FIREBASE_STORAGE_BUCKET }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
      - if: always()
        run: rm -f "${{ steps.auth.outputs.credentials_file_path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: site-data
          path: .site-data.json
          include-hidden-files: true
          retention-days: 1
  render:
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site-data
      - run: npm run build:site
        env:
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.PUBLIC_FIREBASE_STORAGE_BUCKET }}
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 1
  deploy:
    needs: [export, render]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - id: deploy-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: vscn-39508
          workload_identity_provider: projects/365553954084/locations/global/workloadIdentityPools/vscn-hosting-deploy/providers/github-main
          service_account: vscn-hosting-deployer@vscn-39508.iam.gserviceaccount.com
      # RULES GO BEFORE HOSTING, in the same job and on the same credential.
      # Until 2026-09-22 nothing deployed rules at all: both workflows were
      # --only hosting, so every ruleset change was a hand deploy somebody had
      # to remember. An old branch's rules once silently replaced newer ones that
      # way, and the storage size cap went with them. The order is the other
      # half of it: a frontend that writes a new field fails SILENTLY against
      # rules that predate it, because the hasOnly allowlist rejects the whole
      # write with no error anywhere. Deploying rules first cannot regress that.
      #
      # The deployer needs roles/firebaserules.admin for this, recorded in the
      # EXPECTED table in scripts/verify-release.mjs. The rules themselves are
      # already tested against the emulator by the verify job this needs.
      - name: Deploy security rules
        run: npx -y firebase-tools@latest deploy --only firestore:rules,storage --project vscn-39508 --non-interactive
      - run: npx -y firebase-tools@latest deploy --only hosting --project vscn-39508 --non-interactive
      - if: always()
        run: rm -f "${{ steps.deploy-auth.outputs.credentials_file_path }}"
      - id: publication-auth
        if: needs.export.outputs.revision != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/365553954084/locations/global/workloadIdentityPools/vscn-hosting-deploy/providers/github-main
          service_account: vscn-hosting-deployer@vscn-39508.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: https://us-central1-vscn-39508.cloudfunctions.net/acknowledgeSitePublication
          create_credentials_file: false
      - name: Acknowledge published revision
        if: needs.export.outputs.revision != ''
        env:
          PUBLICATION_TOKEN: ${{ steps.publication-auth.outputs.id_token }}
          PUBLICATION_REVISION: ${{ needs.export.outputs.revision }}
        run: |
          curl --fail-with-body --retry 3 -X POST 'https://us-central1-vscn-39508.cloudfunctions.net/acknowledgeSitePublication' \
            -H "Authorization: Bearer $PUBLICATION_TOKEN" -H 'Content-Type: application/json' \
            --data "{\"revision\":\"$PUBLICATION_REVISION\"}"
