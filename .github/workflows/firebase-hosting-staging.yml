name: Deploy to Firebase Hosting Staging
# Staging follows dev. The push trigger was removed on 2026-05-26 (3e8e2fc),
# when dev was a scratch branch that every half-finished push would have
# redeployed under whoever was looking at staging. Restored 2026-09-07 (Josh:
# "wouldn't it make sense to have autodeploy on for dev?"): dev is now reached
# only through PRs merged on GitHub, so a push IS a reviewed merge; the
# requestRebuild function already dispatches this workflow on every staging
# profile save, so staging rebuilt itself on data changes but lagged on code
# changes until someone remembered to deploy — which is what happened with #5.
# workflow_dispatch stays for requestRebuild and for a deliberate rebuild.
on:
  push:
    branches:
      - dev
  workflow_dispatch:
# One staging deploy at a time, newest wins. A merge landing while a
# profile-save rebuild is in flight cancels it, which loses nothing: the build
# reads Firestore at build time, so the newer run carries the newer data too.
concurrency:
  group: staging-deploy
  cancel-in-progress: false
jobs:
  # A MEMBER REBUILD DOES NOT RE-TEST THE CODE. A workflow_dispatch from
  # flushMemberRebuilds builds the same commit an earlier run already built;
  # only the Firestore data is new, and verify reads none of it. So verify is
  # skipped when THIS commit already has a green `verify / verify` check run,
  # and runs otherwise: when this commit's push run failed verify, or was
  # replaced in the concurrency queue before it got that far. A push always
  # verifies. The lookup fails open, so an API error means verify runs.
  # Security rules still deploy on every run (about 4 s): a release that failed
  # at the rules step skipped Hosting too, and a rebuild that then deployed
  # Hosting alone would put the frontend ahead of its rules.
  # The jobs below verify carry `!cancelled() && !failure()` because a skipped
  # job otherwise skips everything downstream of it, transitively.
  verified:
    runs-on: ubuntu-latest
    permissions:
      checks: read
    outputs:
      already: ${{ steps.lookup.outputs.already }}
    steps:
      - id: lookup
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=verify%20%2F%20verify&filter=all"             --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null || echo 0)
          if [ "$runs" -gt 0 ] 2>/dev/null; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_SHA already passed verify ($runs green runs); this rebuild skips it."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
  verify:
    needs: verified
    if: needs.verified.outputs.already != 'true'
    uses: ./.github/workflows/verify.yml
  # BACKEND BEFORE HOSTING. A frontend must never go live ahead of the
  # callables it calls, so Functions deploy first and a failure stops the run.
  # A release (push) always deploys. A workflow_dispatch is a member-triggered
  # rebuild from flushMemberRebuilds, several an hour: it asks the Functions
  # API whether every export already carries this commit's source digest
  # (scripts/backend-current.mjs) and deploys only when one does not, e.g.
  # after a release whose backend deploy failed. Publishing content therefore
  # does not redeploy the backend on every member save.
  # Fail-closed like production (firebase-hosting-merge.yml): without its
  # deploy identity nothing publishes. Staging was soft while DEV_FUNCTIONS_*
  # were unset; they have been set since 2026-09-28 and dev Functions deploy
  # from here, so the soft path only ever served a variable deleted by
  # accident, which should stop the run rather than warn on a green one.
  backend:
    needs: verify
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require backend deploy identity
        id: identity
        env:
          BACKEND_PROVIDER: ${{ vars.DEV_FUNCTIONS_WIF_PROVIDER }}
          BACKEND_ACCOUNT: ${{ vars.DEV_FUNCTIONS_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$BACKEND_PROVIDER" ] && [ -n "$BACKEND_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::DEV_FUNCTIONS_WIF_PROVIDER and DEV_FUNCTIONS_SERVICE_ACCOUNT must be set: staging never publishes a frontend without deploying its backend."
            exit 1
          fi
      - if: steps.identity.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.identity.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - if: steps.identity.outputs.configured == 'true'
        run: npm ci
      - if: steps.identity.outputs.configured == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: vscn-dev-f4b60
          workload_identity_provider: ${{ vars.DEV_FUNCTIONS_WIF_PROVIDER }}
          service_account: ${{ vars.DEV_FUNCTIONS_SERVICE_ACCOUNT }}
      - name: Is this commit's backend already deployed?
        id: current
        if: steps.identity.outputs.configured == 'true' && github.event_name != 'push'
        run: node scripts/backend-current.mjs --project vscn-dev-f4b60
      - name: Deploy backend before exporting or deploying Hosting
        if: steps.identity.outputs.configured == 'true' && (github.event_name == 'push' || steps.current.outputs.current != 'true')
        env:
          # The CLI's 10 s discovery window is too tight for this codebase
          # (memory note functions-deploy-discovery-timeout); seconds.
          FUNCTIONS_DISCOVERY_TIMEOUT: "60"
        run: npx -y firebase-tools@15.32.0 deploy --only functions --project vscn-dev-f4b60 --non-interactive
  export:
    needs: [verify, backend]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      revision: ${{ steps.publication.outputs.revision }}
      generation: ${{ steps.publication.outputs.generation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: vscn-dev-f4b60
          workload_identity_provider: projects/640269226461/locations/global/workloadIdentityPools/vscn-site-export/providers/github-vscn
          service_account: vscn-build-reader@vscn-dev-f4b60.iam.gserviceaccount.com
          export_environment_variables: false
      - id: publication
        run: node scripts/publication.mjs begin
        env:
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.DEV_FIREBASE_STORAGE_BUCKET }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
      - run: npm run export:site-data development
        env:
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.DEV_FIREBASE_STORAGE_BUCKET }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
      - if: always()
        run: rm -f "${{ steps.auth.outputs.credentials_file_path }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-data
          path: .site-data.json
          include-hidden-files: true
          retention-days: 1
  render:
    needs: export
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-data
      - run: npm run build:site -- --mode development
        env:
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.DEV_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.DEV_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.DEV_FIREBASE_STORAGE_BUCKET }}
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.DEV_FIREBASE_MESSAGING_SENDER_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ secrets.DEV_FIREBASE_APP_ID }}
          # Cloudflare's published always-pass Turnstile TEST key: public by design,
          # so staging exercises the App Check pipeline without a real widget.
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: dist
          retention-days: 1
  deploy:
    needs: [export, render]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: dist
      - id: deploy-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: vscn-dev-f4b60
          workload_identity_provider: projects/640269226461/locations/global/workloadIdentityPools/vscn-hosting-deploy/providers/github-dev
          service_account: vscn-hosting-deployer@vscn-dev-f4b60.iam.gserviceaccount.com
      # Rules before hosting, for the reasons spelled out in
      # firebase-hosting-merge.yml. Dev is where a rules change lands first, so
      # this is the copy that proves the step works.
      - name: Deploy security rules
        run: npx -y firebase-tools@15.32.0 deploy --only firestore:rules,storage --project vscn-dev-f4b60 --non-interactive
      - run: npx -y firebase-tools@15.32.0 deploy --only hosting --project vscn-dev-f4b60 --non-interactive
      - if: always()
        run: rm -f "${{ steps.deploy-auth.outputs.credentials_file_path }}"
      - id: publication-auth
        if: needs.export.outputs.revision != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/640269226461/locations/global/workloadIdentityPools/vscn-hosting-deploy/providers/github-dev
          service_account: vscn-hosting-deployer@vscn-dev-f4b60.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: https://us-central1-vscn-dev-f4b60.cloudfunctions.net/acknowledgeSitePublication
          create_credentials_file: false
      - name: Acknowledge published revision
        if: needs.export.outputs.revision != ''
        env:
          PUBLICATION_TOKEN: ${{ steps.publication-auth.outputs.id_token }}
          PUBLICATION_REVISION: ${{ needs.export.outputs.revision }}
          PUBLICATION_GENERATION: ${{ needs.export.outputs.generation }}
        run: |
          curl --fail-with-body --retry 3 -X POST 'https://us-central1-vscn-dev-f4b60.cloudfunctions.net/acknowledgeSitePublication' \
            -H "Authorization: Bearer $PUBLICATION_TOKEN" -H 'Content-Type: application/json' \
            --data "{\"revision\":\"$PUBLICATION_REVISION\",\"generation\":$PUBLICATION_GENERATION}"
