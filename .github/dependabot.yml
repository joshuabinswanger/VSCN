# Version updates (review T2-11). Dependabot ALERTS and security updates are
# a repository setting, not this file, and are off as of 2026-09-30.
#
# PRs target dev, the integration branch, like every other change; main only
# moves by release PR. Minor and patch bumps are grouped per ecosystem so a
# week is one PR per tree, not twenty. Dependabot writes its lockfiles on
# Linux, which is what CI's `npm ci` expects (a Windows `npm install` drops the
# Linux-only optional entries), and it keeps the SHA-pinned actions' version
# comments current.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      root-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /functions
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      functions-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
