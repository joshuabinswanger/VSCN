<text x="478" y="783" font-size="9" font-weight="400" fill="#000" letter-spacing="0.06em">ILLUSTRATION · NEUROSCIENCE</text>
<text x="48" y="833" font-size="10" font-weight="600" fill="#686868" letter-spacing="1">LAYOUT</text>
<text x="48" y="851" font-size="12" font-weight="400" fill="#000" >Header 56px desktop / 48px phone · page measure --shell-max 900px, 15px gutters · works column 48rem</text>
<text x="48" y="871" font-size="12" font-weight="400" fill="#000" >Breakpoints: phone = width ≤ 767px OR coarse pointer (iPad counts as phone); desktop otherwise</text>
<text x="48" y="891" font-size="12" font-weight="400" fill="#000" >Editor keys 38px (36/32 on phone) · bar pills 36px · bar radius 24px · pager chevrons 0.38rem</text>
