<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360">
  <g id="Paper"><rect id="paper" x="0" y="0" width="1440" height="360" fill="#fcfbfa"/></g>

  <g id="Label A (signed out)"><text x="30" y="16" font-family="Archivo" font-size="10" font-weight="600" letter-spacing="0.8" fill="#686868">DESKTOP TOP BAR - SIGNED OUT, ON /COMMUNITY (1440 WIDE, 30 PX SIDES)</text></g>

  <!-- ROW 1: 56 px -->
  <g id="Row 1 / Left">
    <text id="brand" x="30" y="36" font-family="Archivo" font-size="20" font-weight="700" letter-spacing="-0.4" fill="#000000">VSCN</text>
    <text id="link-info" x="104" y="33" font-family="Archivo" font-size="13" font-weight="600" letter-spacing="0.5" fill="#000000">INFO</text>
    <text id="link-community" x="158" y="33" font-family="Archivo" font-size="13" font-weight="600" letter-spacing="0.5" fill="#000000">COMMUNITY</text>
    <line id="link-active" x1="158" y1="38" x2="243" y2="38" stroke="#000000" stroke-width="1"/>
  </g>

  <g id="Row 1 / Search pill">
    <rect id="pill" x="520" y="20" width="400" height="40" rx="20" ry="20" fill="#fcfbfa" stroke="#e0e0e0" stroke-width="1"/>
    <g id="icon-search" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round">
      <circle cx="548" cy="39" r="6"/>
      <line x1="552.5" y1="43.5" x2="557" y2="48"/>
    </g>
    <text id="query" x="572" y="44" font-family="Archivo" font-size="13" font-weight="500" fill="#000000">test</text>
    <g id="clear">
      <circle cx="838" cy="40" r="9" fill="#000000"/>
      <g stroke="#fcfbfa" stroke-width="1.4" stroke-linecap="round"><line x1="834.5" y1="36.5" x2="841.5" y2="43.5"/><line x1="841.5" y1="36.5" x2="834.5" y2="43.5"/></g>
    </g>
    <line id="divider" x1="864" y1="30" x2="864" y2="50" stroke="#e0e0e0" stroke-width="1"/>
    <g id="icon-scope" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="880" y="31" width="18" height="18" rx="4"/>
      <circle cx="889" cy="40" r="3"/>
    </g>
  </g>

  <g id="Row 1 / Right">
    <text id="login" x="1226" y="44" font-family="Archivo" font-size="13" font-weight="600" letter-spacing="0.5" fill="#000000">LOGIN</text>
    <rect id="signup-pill" x="1290" y="20" width="120" height="40" rx="20" ry="20" fill="#000000"/>
    <text id="signup" x="1350" y="44" text-anchor="middle" font-family="Archivo" font-size="13" font-weight="600" letter-spacing="0.5" fill="#fcfbfa">SIGN UP</text>
  </g>

  <!-- ROW 2: 64 px, y 80..144 -->
  <g id="Row 2 / Title">
    <text id="title" x="30" y="122" font-family="Archivo" font-size="19" font-weight="700" letter-spacing="-0.4" fill="#000000">Portfolios</text>
  </g>

  <g id="Row 2 / View tabs">
    <rect id="tabs-track" x="560" y="90" width="320" height="44" rx="22" ry="22" fill="none" stroke="#e0e0e0" stroke-width="1"/>
    <rect id="tab-active" x="564" y="94" width="116" height="36" rx="18" ry="18" fill="#000000"/>
    <text id="tab-portfolios" x="622" y="116" text-anchor="middle" font-family="Archivo" font-size="13" font-weight="600" letter-spacing="0.5" fill="#fcfbfa">Portfolios</text>
    <text id="tab-images" x="720" y="116" text-anchor="middle" font-family="Archivo" font-size="13" font-weight="600" letter-spacing="0.5" fill="#000000">Images</text>
    <text id="tab-people" x="822" y="116" text-anchor="middle" font-family="Archivo" font-size="13" font-weight="600" letter-spacing="0.5" fill="#000000">People</text>
  </g>

  <g id="Row 2 / Sort + filter">
    <g id="btn-sort">
      <circle cx="1352" cy="112" r="20" fill="none" stroke="#e0e0e0" stroke-width="1"/>
      <g fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1346 118 V105 M1342.5 108.5 L1346 105 L1349.5 108.5"/>
        <path d="M1358 106 V119 M1354.5 115.5 L1358 119 L1361.5 115.5"/>
      </g>
    </g>
    <g id="btn-filter">
      <circle cx="1400" cy="112" r="20" fill="none" stroke="#e0e0e0" stroke-width="1"/>
      <g fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round">
        <line x1="1391" y1="107" x2="1409" y2="107"/><circle cx="1396" cy="107" r="2.2" fill="#fcfbfa"/>
        <line x1="1391" y1="117" x2="1409" y2="117"/><circle cx="1404" cy="117" r="2.2" fill="#fcfbfa"/>
      </g>
    </g>
  </g>

  <g id="Guides"><line x1="0" y1="160" x2="1440" y2="160" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4 4"/></g>

  <!-- VARIANT B: signed in -->
  <g id="Label B (signed in)"><text x="30" y="196" font-family="Archivo" font-size="10" font-weight="600" letter-spacing="0.8" fill="#686868">VARIANT - SIGNED IN (30 PX ROUND AVATAR REPLACES LOGIN + SIGN UP)</text></g>
  <g id="B / Row 1 / Left">
    <text x="30" y="236" font-family="Archivo" font-size="20" font-weight="700" letter-spacing="-0.4" fill="#000000">VSCN</text>
    <text x="104" y="233" font-family="Archivo" font-size="13" font-weight="600" letter-spacing="0.5" fill="#000000">INFO</text>
    <text x="158" y="233" font-family="Archivo" font-size="13" font-weight="600" letter-spacing="0.5" fill="#000000">COMMUNITY</text>
    <line x1="158" y1="238" x2="243" y2="238" stroke="#000000" stroke-width="1"/>
  </g>
  <g id="B / Row 1 / Search pill (empty)">
    <rect x="520" y="220" width="400" height="40" rx="20" ry="20" fill="#fcfbfa" stroke="#e0e0e0" stroke-width="1"/>
    <g fill="none" stroke="#686868" stroke-width="1.5" stroke-linecap="round"><circle cx="548" cy="239" r="6"/><line x1="552.5" y1="243.5" x2="557" y2="248"/></g>
    <text x="572" y="244" font-family="Archivo" font-size="13" font-weight="500" fill="#707070">Search people, works, tags</text>
  </g>
  <g id="B / Row 1 / Right">
    <circle id="avatar" cx="1395" cy="240" r="15" fill="#e0e0e0"/>
  </g>
</svg>
